<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamil.pl</title>
<style>
body{margin:0;background:#080d18;color:white;font-family:Arial;text-align:center}
header{background:#101d32;padding:30px;border-bottom:2px solid #168bff}
h1{color:#168bff;font-size:38px}
main{max-width:700px;margin:auto;padding:20px}
.card{background:#142238;padding:20px;margin:18px 0;border-radius:15px}
button{background:#087cf0;color:white;border:0;padding:12px 20px;border-radius:8px;font-size:16px}
.price{color:#54b5ff;font-size:22px}
</style>
</head>
<body>
<header>
<h1>Kamil.pl</h1>
<p>Twoje pomysły. Nasz druk 3D.</p>
</header>
<main>
<div class="card">
<h2>Witaj w Kamil.pl!</h2>
<p>Sklep z wyjątkowymi wydrukami 3D.</p>
</div>
<div class="card">
<h2>🔑 Brelok 3D</h2>
<p class="price">8 zł</p>
<button onclick="add('Brelok 3D',8)">Dodaj do koszyka</button>
</div>
<div class="card">
<h2>⭐ Ozdoba 3D</h2>
<p class="price">15 zł</p>
<button onclick="add('Ozdoba 3D',15)">Dodaj do koszyka</button>
</div>
<div class="card">
<h2>🛒 Koszyk</h2>
<div id="cart">Koszyk jest pusty.</div>
<h3 id="total">Razem: 0 zł</h3>
</div>
</main>
<script>
let products=[];
function add(name,price){
products.push({name,price});
document.getElementById('cart').innerHTML=products.map(p=>p.name+' — '+p.price+' zł').join('<br>');
document.getElementById('total').textContent='Razem: '+products.reduce((s,p)=>s+p.price,0)+' zł';
}
</script>
</body>
</html>
